<header class="header" [class.scrolled]="isScrolled">
    <div class="container nav-container">
        <a href="#" class="logo" (click)="closeMenu()">
            <span class="logo-mark">V</span>
            <span class="logo-text">Viljo<span class="dot">.</span></span>
        </a>

        <nav [class.open]="isMenuOpen">
            <ul>
                <li *ngFor="let link of links">
                    <a [href]="'#' + link.id" [class.active]="activeSection === link.id" (click)="closeMenu()">
                        {{ link.label }}
                    </a>
                </li>
            </ul>
            <a href="#contact" class="btn nav-cta" (click)="closeMenu()">Hire Me</a>
        </nav>

        <button class="mobile-toggle" [class.open]="isMenuOpen" (click)="toggleMenu()"
            [attr.aria-expanded]="isMenuOpen" aria-label="Toggle navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>
</header>
