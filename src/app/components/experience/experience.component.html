<section id="experience" class="section container">
    <div class="section-header" appScrollReveal>
        <span class="section-eyebrow">02 &middot; Experience</span>
        <h2 class="section-title">Where I've <span class="gradient-text">worked</span></h2>
    </div>

    <div class="timeline">
        <div class="timeline-item" *ngFor="let exp of experiences; let i = index" appScrollReveal
            [delay]="i * 0.15 + 's'">
            <div class="marker" [class.current]="exp.current"></div>
            <div class="timeline-content card">
                <div class="top">
                    <div>
                        <h3>{{ exp.position }}</h3>
                        <h4>{{ exp.company }}</h4>
                    </div>
                    <span class="badge" [class.current]="exp.current">{{ exp.current ? 'Current' : 'Completed' }}</span>
                </div>
                <div class="meta">
                    <span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                        {{ exp.duration }}
                    </span>
                    <span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                        {{ exp.location }}
                    </span>
                </div>
                <ul *ngIf="exp.responsibilities">
                    <li *ngFor="let resp of exp.responsibilities">{{ resp }}</li>
                </ul>
                <div class="tags" *ngIf="exp.stack">
                    <span class="skill-item" *ngFor="let t of exp.stack">{{ t }}</span>
                </div>
            </div>
        </div>
    </div>
</section>
